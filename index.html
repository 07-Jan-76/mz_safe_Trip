<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1F22">
<title>As minhas apps</title>
<style>
:root{--bg:#EEF1F4;--surface:#fff;--ink:#13243A;--muted:#5D6B7A;--line:#D8DEE5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1520;--surface:#172231;--ink:#E6ECF2;--muted:#94A3B4;--line:#283648;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.4rem;margin:0 0 4px}
a{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;color:inherit;text-decoration:none}
a b{font-size:1.1rem} a span{color:var(--muted);font-size:.92rem}
p{color:var(--muted);font-size:.9rem;margin:0}
</style>
</head>
<body><main>
<h1>As minhas apps</h1>
<p>Abra a app que quer e, no Chrome, toque em ⋮ → Instalar app.</p>
<a href="minibus/"><b>Controlo dos Minibus</b><span>Escala, receitas, dia do motorista e manutenções do AOS-264 e ANM-721</span></a>
<a href="contas/"><b>As Minhas Contas</b><span>Saldo disponível, despesas, plano do mês e resumo</span></a>
</main>
<script>
// remove a instalação antiga da raiz, se existir
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(new URL(r.scope).pathname.replace(/\/$/,'')===location.pathname.replace(/\/(index\.html)?$/,''))r.unregister()})).catch(()=>{});
</script>
</body></html>
