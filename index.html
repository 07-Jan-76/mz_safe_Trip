<style>
/* Layout: app de telemóvel — cabeçalho curto, conteúdo em cartões por carro, barra de separadores fixa em baixo */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --sunk:#F5F7F3; --ink:#1A1F22; --muted:#5E676B; --line:#D5DAD3;
  --accent:#D9971A; --accent-ink:#1A1F22; --accent-soft:#F7E7C2;
  --ok:#2C8A55; --ok-soft:#D7EEDF; --falta:#C13E2B; --falta-soft:#F6DCD6;
  --manut:#3A6DB5; --manut-soft:#DCE6F4; --folga:#C9CEC6; --prev:#E8EBE5; --mot:#7E4FAE; --mot-soft:#ECE2F5;
  --car-cinz:#7B848A; --car-bran:#FFFFFF; --car-edge:#1A1F22;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181A; --surface:#1E2427; --sunk:#192023; --ink:#E7EBE6; --muted:#9BA4A8; --line:#30383C;
  --accent:#F0B33C; --accent-ink:#14181A; --accent-soft:#3D3220;
  --ok:#52B983; --ok-soft:#1E3529; --falta:#E3715C; --falta-soft:#3C2420;
  --manut:#76A2E4; --manut-soft:#1F2C40; --folga:#3A4246; --prev:#252C30; --mot:#B892E3; --mot-soft:#2F2540;
  --car-cinz:#98A1A6; --car-bran:#F3F4F1; --car-edge:#E7EBE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181A; --surface:#1E2427; --sunk:#192023; --ink:#E7EBE6; --muted:#9BA4A8; --line:#30383C;
  --accent:#F0B33C; --accent-ink:#14181A; --accent-soft:#3D3220;
  --ok:#52B983; --ok-soft:#1E3529; --falta:#E3715C; --falta-soft:#3C2420;
  --manut:#76A2E4; --manut-soft:#1F2C40; --folga:#3A4246; --prev:#252C30; --mot:#B892E3; --mot-soft:#2F2540;
  --car-cinz:#98A1A6; --car-bran:#F3F4F1; --car-edge:#E7EBE6; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.brand{font-family:var(--f-disp);font-weight:700;font-size:1.45rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.08em;opacity:.7;margin-top:4px}
.sync{font-size:.75rem;display:flex;align-items:center;gap:6px;opacity:.85;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--folga);display:inline-block}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--falta)}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
.lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:.9rem}

/* navegação de datas */
.datenav{display:flex;align-items:center;gap:8px}
.datenav .mid{flex:1;min-width:0;text-align:center}
.datenav .big{font-family:var(--f-disp);font-weight:700;font-size:1.6rem;line-height:1.1;text-transform:uppercase}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
:root .linkbtn{color:var(--ink)}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h .name{font-family:var(--f-disp);font-weight:700;font-size:1.3rem;text-transform:uppercase;flex:1;min-width:0;line-height:1.1}
.card-h .name small{display:block;font-family:var(--f-body);font-weight:500;font-size:.75rem;text-transform:none;color:var(--muted);letter-spacing:0;margin-top:2px}
.card-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.bus{width:30px;height:18px;border-radius:5px 7px 4px 4px;border:2px solid var(--car-edge);position:relative;flex:none}
.bus::after{content:"";position:absolute;left:3px;right:9px;top:3px;height:4px;border-radius:1px;background:var(--car-edge);opacity:.55}
.bus.cinzento{background:var(--car-cinz)} .bus.branco{background:var(--car-bran)}
.bus.sm{width:20px;height:12px;border-width:1.5px}
.bus.sm::after{left:2px;right:6px;top:2px;height:3px}

.st-ok{background:var(--ok-soft);color:var(--ok)} .st-falta{background:var(--falta-soft);color:var(--falta)}
.st-manut{background:var(--manut-soft);color:var(--manut)} .st-pend{background:var(--accent-soft);color:var(--ink)}
.st-folga{background:var(--sunk);color:var(--muted)} .st-prev{background:var(--sunk);color:var(--ink)} .st-fora{background:var(--sunk);color:var(--muted)}
.st-mot{background:var(--mot-soft);color:var(--mot)} .b-mot{background:var(--mot)}
.note-mot{background:var(--mot-soft);border-radius:10px;padding:12px;color:var(--ink)}
.ciclo{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.ciclo i{width:14px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.ciclo i.on{background:var(--ok)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:block;text-align:center;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;background:var(--sunk)}
.seg input:checked+label.y{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.seg input:checked+label.n{background:var(--falta);border-color:var(--falta);color:var(--surface)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk);min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.money{position:relative}
.money input{padding-right:46px;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.money span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--falta);border-color:var(--falta)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn.primary{flex:1}
.note-maint{background:var(--manut-soft);border-radius:10px;padding:12px;color:var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border:1px dashed var(--line);border-radius:12px}
.total b{font-family:var(--f-disp);font-size:1.6rem}

.pend{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:999px;padding:6px 10px;font-size:.85rem;font-weight:600}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase;padding-bottom:2px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 3px 5px;display:flex;flex-direction:column;gap:3px;min-height:58px;text-align:left}
.cell .d{font-size:.8rem;font-weight:600;padding-left:2px}
.cell.today .d{color:var(--accent-ink);background:var(--accent);border-radius:4px;align-self:flex-start;padding:0 4px}
.cell.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cell.blank{visibility:hidden}
.bar{height:9px;border-radius:3px}
.b-ok{background:var(--ok)} .b-falta{background:var(--falta)} .b-manut{background:var(--manut)}
.b-pend{background:var(--accent)} .b-folga{background:transparent;border:1px dashed var(--folga)} .b-prev{background:var(--folga)} .b-fora{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .bar{width:18px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}

/* manutenção */
.mlist{display:flex;flex-direction:column;gap:12px}
.mcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.comments{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--manut);padding-left:10px}
.comments p{margin:0;font-size:.92rem}
.comments time{display:block;font-size:.75rem;color:var(--muted)}
.addc{display:flex;gap:8px}
.addc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk);min-height:44px}

/* relatório */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-disp);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.wide{grid-column:1/-1}
.pos{color:var(--ok)} .neg{color:var(--falta)}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:6px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column-reverse;gap:1px;min-width:0;height:100%}
.chart .seg-c{background:var(--car-cinz);border-radius:2px 2px 0 0}
.chart .seg-b{background:var(--car-bran);border:1px solid var(--car-edge);border-radius:2px 2px 0 0}
.chart-x{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;font-weight:600;color:var(--muted);position:relative}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--falta);color:#fff;border-radius:999px;font-size:.66rem;padding:1px 5px;line-height:1.3}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">Controlo dos Minibus<small>Escala 2 dias · 1 folga</small></div>
    <div class="sync" id="sync"><i></i><span>No telemóvel</span></div>
  </div>
</header>

<main id="main"></main>

<nav class="tabs" aria-label="Secções">
  <div class="in">
    <button data-tab="dia" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2.5 2.5L16 13"/></svg>Dia<span class="badge" id="badge" hidden></span></button>
    <button data-tab="escala"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 18h2M11 18h2"/></svg>Escala</button>
    <button data-tab="manut"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Manutenção</button>
    <button data-tab="rel"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Relatório</button>
  </div>
</nav>

<script>
const CARS=[{id:'cinzento',nome:'AOS-264',modelo:'NISSAN',cor:'Cinzento',rota:'KA-ELISA'},{id:'branco',nome:'ANM-721',modelo:'NISSAN',cor:'Branco',rota:'Pires'}];
const sub=c=>{const x=CARS.find(k=>k.id===c);const mo=cfg.motorista?.[c];return x?`<small>${x.modelo} · ${x.cor} · Rota ${x.rota}${mo?` · Motorista: ${esc(mo)}`:''}</small>`:''};
const DEF={inicio:{cinzento:'2026-10-20',branco:'2026-10-20'},meta:{cinzento:2000,branco:1800},motorista:{cinzento:'',branco:''},trab:2,folga:1};
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESC=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const SEM=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

let cfg=JSON.parse(JSON.stringify(DEF));
let dias={}; let mants=[]; let db=null;
let view='dia'; let sel=hoje(); let calM=sel.slice(0,7); let repM=sel.slice(0,7);
let pendingRender=false; let delArm=null;

/* datas */
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoje(){return fmt(new Date())}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function add(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function longDate(s){const d=parse(s);return SEM[d.getDay()]+', '+d.getDate()+' '+MESC[d.getMonth()]+' '+d.getFullYear()}
function shortDate(s){const d=parse(s);return d.getDate()+' '+MESC[d.getMonth()]}
function monthAdd(m,n){const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1,12);return fmt(d).slice(0,7)}
function monthName(m){const[y,mm]=m.split('-').map(Number);return MES[mm-1]+' '+y}
function daysIn(m){const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()}
function mt(n){n=Math.round(n||0);const s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(n<0?'−':'')+s+' MT'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function carName(c){return CARS.find(x=>x.id===c)?.nome||c}

/* regras da escala */
function escala(c,d){const k=diff(cfg.inicio[c],d);if(k<0)return'fora';return(k%(cfg.trab+cfg.folga))<cfg.trab?'trab':'folga'}
function manutDe(c,d){return mants.find(m=>m.carro===c&&m.inicio<=d&&(!m.fim||d<=m.fim))}
/* ciclo do motorista: a cada 5 dias efectivamente trabalhados, o próximo dia de escala é do motorista (sem receita) */
let CIC={};
function calcCiclos(){
  CIC={};const t=hoje();const N=cfg.ciclo||5;let fim=add(t,400);
  for(const mm of [calM,repM]){const e=mm+'-'+String(daysIn(mm)).padStart(2,'0');if(e>fim)fim=e}
  for(const c of CARS){const id=c.id;const mp={};let k=0;
    for(let d=cfg.inicio[id];d<=fim;d=add(d,1)){
      mp[d]={k};
      if(manutDe(id,d))continue;
      const e=escala(id,d);const r=dias[d]?.[id];
      if(e==='trab'&&k>=N){mp[d].mot=true;k=0;continue}
      if(r){if(r.estado==='entrou')k++;continue}
      if(e==='trab'&&d>t)k++;
    }
    CIC[id]=mp}
}
function estado(c,d){
  const m=manutDe(c,d); if(m)return'manut';
  if(CIC[c]?.[d]?.mot)return'mot';
  const r=dias[d]?.[c]; if(r)return r.estado==='entrou'?'ok':'falta';
  const e=escala(c,d); if(e==='trab')return d<=hoje()?'pend':'prev';
  return e;
}
const ROT={mot:'Dia do motorista',ok:'Entrou',falta:'Não entrou',manut:'Manutenção',pend:'Por confirmar',prev:'Em escala',folga:'Folga',fora:'Fora da escala'};
function pendentes(){
  const out=[];const t=hoje();
  let start=CARS.map(c=>cfg.inicio[c.id]).sort()[0];
  if(diff(start,t)>90)start=add(t,-90);
  for(let d=start;d<=t;d=add(d,1))for(const c of CARS)if(estado(c.id,d)==='pend')out.push({d,c:c.id});
  return out;
}

/* render */
function render(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;return}
  pendingRender=false;calcCiclos();
  const m=document.getElementById('main');
  m.innerHTML=view==='dia'?vDia():view==='escala'?vEscala():view==='manut'?vManut():vRel();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===view?'page':'false'));
  const n=pendentes().length;const bg=document.getElementById('badge');bg.hidden=!n;bg.textContent=n;
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender)render()},50));

const chev=(d)=>`<svg viewBox="0 0 24 24"><path d="${d?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'}"/></svg>`;

function vDia(){
  const p=pendentes();
  let h='';
  {const lb=lastBackup();const dd=lb?diff(lb.slice(0,10),hoje()):null;if(hasData()&&(lb===null||dd>=7))h+=`<div class="banner">${lb?`A última cópia de segurança foi há ${dd} dias.`:'Ainda não fez nenhuma cópia de segurança.'} <button class="linkbtn" data-act="tab" data-t="rel">Fazer cópia agora</button></div>`}
  if(p.length){
    h+=`<section class="pend"><div class="lbl">${p.length} ${p.length===1?'dia por confirmar':'dias por confirmar'}</div><div class="chips">`+
      p.slice(-20).reverse().map(x=>`<button class="chip" data-act="goto" data-d="${x.d}"><span class="bus sm ${x.c}"></span>${shortDate(x.d)}</button>`).join('')+`</div></section>`;
  }
  h+=`<div class="datenav"><button class="iconbtn" data-act="day" data-n="-1" aria-label="Dia anterior">${chev(0)}</button>
    <div class="mid"><div class="big">${sel===hoje()?'Hoje':shortDate(sel)}</div><div class="muted num">${longDate(sel)}</div></div>
    <button class="iconbtn" data-act="day" data-n="1" aria-label="Dia seguinte">${chev(1)}</button></div>`;
  if(sel!==hoje())h+=`<div style="text-align:center;margin-top:-8px"><button class="linkbtn" data-act="goto" data-d="${hoje()}">Voltar a hoje</button></div>`;
  let tot=0;
  for(const c of CARS){
    const st=estado(c.id,sel);const r=dias[sel]?.[c.id];const m=manutDe(c.id,sel);
    if(st==='ok')tot+=r.receita||0;
    const N=cfg.ciclo||5;const kk=Math.min(CIC[c.id]?.[sel]?.k??0,N);
    const esc0=escala(c.id,sel);
    h+=`<article class="card"><div class="card-h"><span class="bus ${c.id}"></span><span class="name">${c.nome}${sub(c.id)}</span><span class="pill st-${st}">${ROT[st]}</span></div><div class="card-b">`;
    if(st==='mot'){
      h+=`<div class="note-mot"><div class="lbl" style="color:var(--mot)">Dia de remuneração do motorista</div><div>Completou ${N} dias trabalhados. Hoje não há receita para o dono e o dia não conta como falta. A contagem recomeça no próximo dia trabalhado.</div></div>`;
    }else if(m){
      h+=`<div class="note-maint"><div class="lbl" style="color:var(--manut)">Parado para manutenção desde ${shortDate(m.inicio)}</div><div>${esc(m.descricao)||'Sem descrição'}</div></div>
        <button class="btn" data-act="tab" data-t="manut">Ver manutenção</button>`;
    }else{
      const ent=r?.estado==='entrou', fal=r?.estado==='falta';
      const hint=esc0==='folga'?'Dia de folga na escala. Registe só se o carro trabalhou.':esc0==='fora'?'Antes do início da escala.':sel>hoje()?'Dia futuro. Pode registar quando chegar.':'Confirme se o carro saiu para trabalhar.';
      h+=`<div class="muted" style="font-size:.88rem">${hint}</div>
      <div class="ciclo" aria-label="Dias trabalhados no ciclo">${Array.from({length:N},(_,i)=>`<i class="${i<kk?'on':''}"></i>`).join('')}<span class="num">${kk} de ${N} trabalhados antes deste dia</span></div>
      <div class="seg" role="radiogroup" aria-label="Entrou ao serviço?">
        <input type="radio" name="e-${c.id}" id="e-${c.id}-s" value="entrou" ${ent?'checked':''}><label class="y" for="e-${c.id}-s">Entrou</label>
        <input type="radio" name="e-${c.id}" id="e-${c.id}-n" value="falta" ${fal?'checked':''}><label class="n" for="e-${c.id}-n">Não entrou</label>
      </div>
      <div class="field" id="rw-${c.id}" ${fal?'hidden':''}><label class="lbl" for="rec-${c.id}">Receita do dia</label>
        <div class="money"><input id="rec-${c.id}" type="number" inputmode="numeric" min="0" step="50" value="${r&&ent?r.receita:cfg.meta[c.id]}"><span>MT</span></div>
        <div class="muted" style="font-size:.8rem">Meta diária: ${mt(cfg.meta[c.id])}</div></div>
      <div class="field"><label class="lbl" for="mot-${c.id}">Motorista do dia</label>
        <input id="mot-${c.id}" type="text" autocomplete="off" placeholder="Nome do motorista" value="${esc(r?.motorista ?? cfg.motorista[c.id] ?? '')}"></div>
      <div class="field"><label class="lbl" for="nota-${c.id}">Comentário</label>
        <textarea id="nota-${c.id}" placeholder="Ex.: motorista atrasou, avaria no caminho…">${esc(r?.nota)}</textarea></div>
      <div class="btns"><button class="btn primary" data-act="save" data-c="${c.id}">Guardar</button>${r?`<button class="btn ghost" data-act="clear" data-c="${c.id}">Apagar registo</button>`:''}</div>`;
    }
    h+=`</div></article>`;
  }
  h+=`<div class="total"><span class="lbl">Receita do dia</span><b class="num">${mt(tot)}</b></div>`;
  return h;
}

function vEscala(){
  const[y,mm]=calM.split('-').map(Number);const first=new Date(y,mm-1,1,12);const off=(first.getDay()+6)%7;const n=daysIn(calM);const t=hoje();
  let h=`<div class="datenav"><button class="iconbtn" data-act="cal" data-n="-1" aria-label="Mês anterior">${chev(0)}</button>
    <div class="mid"><div class="big">${monthName(calM)}</div></div>
    <button class="iconbtn" data-act="cal" data-n="1" aria-label="Mês seguinte">${chev(1)}</button></div>`;
  h+=`<div class="cal">`+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<off;i++)h+=`<div class="cell blank"></div>`;
  for(let d=1;d<=n;d++){const ds=calM+'-'+String(d).padStart(2,'0');
    h+=`<button class="cell ${ds===t?'today':''} ${ds===sel?'sel':''}" data-act="goto" data-d="${ds}" aria-label="${longDate(ds)}"><span class="d num">${d}</span>`+
      CARS.map(c=>`<span class="bar b-${estado(c.id,ds)}" title="${c.nome}: ${ROT[estado(c.id,ds)]}"></span>`).join('')+`</button>`}
  h+=`</div>`;
  h+=`<div class="legend"><span><span class="bus sm cinzento"></span>barra de cima: AOS-264 (KA-ELISA)</span><span><span class="bus sm branco"></span>barra de baixo: ANM-721 (Pires)</span></div>
  <div class="legend"><span><i class="bar b-ok"></i>Entrou</span><span><i class="bar b-falta"></i>Não entrou</span><span><i class="bar b-pend"></i>Por confirmar</span><span><i class="bar b-prev"></i>Em escala</span><span><i class="bar b-folga"></i>Folga</span><span><i class="bar b-manut"></i>Manutenção</span><span><i class="bar b-mot"></i>Dia do motorista</span></div>`;
  h+=`<section class="card"><div class="card-h"><span class="name">Próximos 7 dias</span></div><div class="tbl"><table><thead><tr><th>Dia</th>${CARS.map(c=>`<th>${c.nome}</th>`).join('')}</tr></thead><tbody>`;
  for(let i=0;i<7;i++){const ds=add(t,i);h+=`<tr><td class="num">${i===0?'Hoje':SEM[parse(ds).getDay()].slice(0,3)+' '+shortDate(ds)}</td>${CARS.map(c=>{const s=estado(c.id,ds);return`<td><span class="pill st-${s}">${ROT[s]}</span></td>`}).join('')}</tr>`}
  h+=`</tbody></table></div></section>`;
  return h;
}

function vManut(){
  const t=hoje();
  let h=`<section class="card"><div class="card-h"><span class="name">Registar paragem</span></div><div class="card-b">
    <div class="row"><div class="field"><label class="lbl" for="m-car">Carro</label><select id="m-car">${CARS.map(c=>`<option value="${c.id}">${c.nome} · ${c.rota}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl" for="m-ini">Início</label><input id="m-ini" type="date" value="${t}"></div></div>
    <div class="row"><div class="field"><label class="lbl" for="m-fim">Fim (vazio se ainda está parado)</label><input id="m-fim" type="date"></div>
    <div class="field"><label class="lbl" for="m-custo">Custo</label><div class="money"><input id="m-custo" type="number" inputmode="numeric" min="0" step="50" placeholder="0"><span>MT</span></div></div></div>
    <div class="field"><label class="lbl" for="m-desc">O que foi feito</label><textarea id="m-desc" placeholder="Ex.: troca de óleo e filtros, pastilhas de travão…"></textarea></div>
    <div class="btns"><button class="btn primary" data-act="madd">Registar manutenção</button></div></div></section>`;
  const list=[...mants].sort((a,b)=>(!a.fim===!b.fim)?b.inicio.localeCompare(a.inicio):(a.fim?1:-1));
  h+=`<h2>Histórico</h2>`;
  if(!list.length)h+=`<p class="muted">Ainda não há manutenções registadas. Quando um carro parar, registe aqui: os dias de paragem saem da escala e da receita esperada.</p>`;
  h+=`<div class="mlist">`;
  for(const m of list){
    const fim=m.fim||t;const nd=diff(m.inicio,fim)+1;
    h+=`<article class="card mcard"><div class="card-h"><span class="bus ${m.carro}"></span><span class="name">${carName(m.carro)}${sub(m.carro)}</span><span class="pill ${m.fim?'st-folga':'st-manut'}">${m.fim?'Concluída':'Em curso'}</span></div><div class="card-b">
      <div>${esc(m.descricao)||'<span class="muted">Sem descrição</span>'}</div>
      <div class="meta num"><span>${shortDate(m.inicio)} → ${m.fim?shortDate(m.fim):'em curso'}</span><span>${nd} ${nd===1?'dia':'dias'}</span><span>Custo: ${mt(m.custo)}</span></div>
      ${(m.comentarios||[]).length?`<div class="comments">${m.comentarios.map(k=>`<div><time>${longDate(k.data)}</time><p>${esc(k.texto)}</p></div>`).join('')}</div>`:''}
      <div class="addc"><input id="c-${m.id}" placeholder="Adicionar comentário" aria-label="Comentário"><button class="btn" data-act="mcom" data-id="${m.id}">Adicionar</button></div>
      <div class="row"><div class="field"><label class="lbl" for="mc-${m.id}">Actualizar custo</label><div class="money"><input id="mc-${m.id}" type="number" inputmode="numeric" min="0" value="${m.custo||0}"><span>MT</span></div></div></div>
      <div class="btns">${m.fim?`<button class="btn" data-act="mreopen" data-id="${m.id}">Reabrir</button>`:`<button class="btn primary" data-act="mclose" data-id="${m.id}">Carro voltou hoje</button>`}
        <button class="btn" data-act="mcost" data-id="${m.id}">Guardar custo</button>
        <button class="btn danger" data-act="mdel" data-id="${m.id}">${delArm===m.id?'Tocar de novo para apagar':'Apagar'}</button></div>
    </div></article>`;
  }
  return h+`</div>`;
}

function stats(c,m){
  const n=daysIn(m);const t=hoje();const s={mot:0,escala:0,ok:0,falta:0,manut:0,pend:0,rec:0,esp:0,espHoje:0,custo:0,daily:[]};
  for(let d=1;d<=n;d++){const ds=m+'-'+String(d).padStart(2,'0');const st=estado(c,ds);const r=dias[ds]?.[c];
    const v=st==='ok'?(r.receita||0):0;s.rec+=v;s.daily.push(v);
    if(st==='manut'){s.manut++;continue}
    if(st==='mot'){s.mot++;continue}
    if(st==='ok')s.ok++; if(st==='falta')s.falta++; if(st==='pend')s.pend++;
    if(escala(c,ds)==='trab'){s.escala++;s.esp+=cfg.meta[c];if(ds<=t)s.espHoje+=cfg.meta[c]}}
  s.custo=mants.filter(x=>x.carro===c&&x.inicio.slice(0,7)===m).reduce((a,x)=>a+(x.custo||0),0);
  return s;
}
function vRel(){
  let h=`<div class="datenav"><button class="iconbtn" data-act="rep" data-n="-1" aria-label="Mês anterior">${chev(0)}</button>
    <div class="mid"><div class="big">${monthName(repM)}</div></div>
    <button class="iconbtn" data-act="rep" data-n="1" aria-label="Mês seguinte">${chev(1)}</button></div>`;
  const all=CARS.map(c=>({c,s:stats(c.id,repM)}));
  const T={rec:0,esp:0,espHoje:0,custo:0};all.forEach(({s})=>{T.rec+=s.rec;T.esp+=s.esp;T.espHoje+=s.espHoje;T.custo+=s.custo});
  const dif=T.rec-T.espHoje;
  h+=`<section class="kpis"><div class="kpi wide"><span class="lbl">Receita realizada · 2 carros</span><b>${mt(T.rec)}</b></div>
    <div class="kpi"><span class="lbl">Esperada até hoje</span><b>${mt(T.espHoje)}</b></div>
    <div class="kpi"><span class="lbl">Diferença</span><b class="${dif<0?'neg':'pos'}">${mt(dif)}</b></div>
    <div class="kpi"><span class="lbl">Custo manutenção</span><b>${mt(T.custo)}</b></div>
    <div class="kpi"><span class="lbl">Receita − manutenção</span><b>${mt(T.rec-T.custo)}</b></div>
    <div class="kpi wide"><span class="lbl">Previsão do mês inteiro (escala × meta)</span><b>${mt(T.esp)}</b></div></section>`;
  const n=daysIn(repM);const max=Math.max(1,...Array.from({length:n},(_,i)=>all.reduce((a,{s})=>a+s.daily[i],0)));
  h+=`<section class="card"><div class="card-h"><span class="name">Receita por dia</span></div><div class="card-b"><div class="chart" role="img" aria-label="Receita diária do mês">`+
    Array.from({length:n},(_,i)=>`<div class="col">${all.map(({c,s})=>s.daily[i]?`<div class="seg-${c.id==='cinzento'?'c':'b'}" style="height:${s.daily[i]/max*100}%"></div>`:'').join('')}</div>`).join('')+
    `</div><div class="chart-x num"><span>1</span><span>${Math.ceil(n/2)}</span><span>${n}</span></div>
    <div class="legend"><span><span class="bus sm cinzento"></span>AOS-264</span><span><span class="bus sm branco"></span>ANM-721</span><span>Máx. ${mt(max)}</span></div></div></section>`;
  h+=`<section class="card"><div class="card-h"><span class="name">Por carro</span></div><div class="tbl"><table><thead><tr><th></th>${CARS.map(c=>`<th class="r">${c.nome}</th>`).join('')}</tr></thead><tbody>`;
  const rows=[['Dias em escala','escala'],['Entrou','ok'],['Não entrou','falta'],['Por confirmar','pend'],['Dias em manutenção','manut'],['Dias do motorista','mot'],['Receita','rec',1],['Esperada até hoje','espHoje',1],['Custo manutenção','custo',1]];
  for(const[l,k,mon]of rows)h+=`<tr><td>${l}</td>${all.map(({s})=>`<td class="r num">${mon?mt(s[k]):s[k]}</td>`).join('')}</tr>`;
  h+=`<tr><td><b>Média por dia trabalhado</b></td>${all.map(({s})=>`<td class="r num"><b>${s.ok?mt(s.rec/s.ok):'—'}</b></td>`).join('')}</tr>`;
  h+=`</tbody></table></div></section>`;
  {const lb=lastBackup();
  h+=`<section class="card" id="copia"><div class="card-h"><span class="name">Cópia de segurança<small>${lb?'Última cópia: '+longDate(lb.slice(0,10)):'Ainda sem cópia'}</small></span></div><div class="card-b">
    <div class="muted" style="font-size:.88rem">Os dados ficam guardados só neste telemóvel. Faça uma cópia pelo menos uma vez por semana. No telemóvel, escolha <b>OneDrive</b> no menu de partilha e a pasta que quiser. No computador, abre a janela para escolher a pasta.</div>
    <div class="btns"><button class="btn primary" data-act="bk">Fazer cópia (OneDrive / pasta)</button><button class="btn" data-act="bkdl">Descarregar ficheiro</button></div>
    <div class="btns"><button class="btn" data-act="csv">Exportar para Excel</button><label class="btn" for="rf" style="text-align:center;flex:1">Restaurar cópia</label></div>
    <input id="rf" type="file" accept=".json,application/json" hidden>
    ${restoreData?`<div class="banner"><b>Cópia de ${longDate(restoreData.criado.slice(0,10))}</b>: ${Object.keys(restoreData.dias).length} dias registados e ${restoreData.mants.length} manutenções. Restaurar substitui todos os dados actuais deste telemóvel.<div class="btns" style="margin-top:8px"><button class="btn primary" data-act="rsok">Restaurar agora</button><button class="btn" data-act="rsno">Cancelar</button></div></div>`:''}
  </div></section>`}
  h+=`<section class="card"><div class="card-h"><span class="name">Definições</span></div><div class="card-b">`+
    CARS.map(c=>`<div class="field"><label class="lbl" for="s-mot-${c.id}">Motorista ${c.nome} (${c.rota})</label><input id="s-mot-${c.id}" type="text" autocomplete="off" placeholder="Nome do motorista" value="${esc(cfg.motorista[c.id]||'')}"></div>
      <div class="row"><div class="field"><label class="lbl" for="s-meta-${c.id}">Meta ${c.nome}</label><div class="money"><input id="s-meta-${c.id}" type="number" inputmode="numeric" min="0" step="50" value="${cfg.meta[c.id]}"><span>MT</span></div></div>
      <div class="field"><label class="lbl" for="s-ini-${c.id}">Início escala ${c.nome}</label><input id="s-ini-${c.id}" type="date" value="${cfg.inicio[c.id]}"></div></div>`).join('')+
    `<div class="muted" style="font-size:.85rem">A escala conta a partir da data de início: 2 dias de trabalho, 1 de folga, sempre a repetir. Se a escala mudar, ajuste a data.</div>
    <div class="btns"><button class="btn primary" data-act="cfg">Guardar definições</button></div></div></section>`;
  return h;
}

/* acções */
function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const KEY='minibus-dados-v1', KEYB='minibus-ultima-copia';
function persist(){try{localStorage.setItem(KEY,JSON.stringify({app:'controlo-minibus',versao:1,guardado:new Date().toISOString(),cfg,dias,mants}));return true}catch(e){return false}}
function write(fn,ok){toast(persist()?ok:'Não foi possível guardar no telemóvel. Faça já uma cópia de segurança.')}
function lastBackup(){try{return localStorage.getItem(KEYB)}catch(e){return null}}
function markBackup(){try{localStorage.setItem(KEYB,new Date().toISOString())}catch(e){}}
function hasData(){return Object.keys(dias).length||mants.length}
function backupJSON(){return JSON.stringify({app:'controlo-minibus',versao:1,criado:new Date().toISOString(),cfg,dias,mants},null,1)}
async function saveFile(name,text,type,mode){
  const blob=new Blob([text],{type});
  if(mode!=='download'){
    if(window.showSaveFilePicker){try{const ext='.'+name.split('.').pop();const h=await showSaveFilePicker({suggestedName:name,types:[{description:ext==='.csv'?'Excel (CSV)':'Cópia de segurança',accept:{[type]:[ext]}}]});const w=await h.createWritable();await w.write(blob);await w.close();return 'ok'}catch(e){if(e.name==='AbortError')return 'cancel'}}
    try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'ok'}}catch(e){if(e.name==='AbortError')return 'cancel'}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return 'ok';
}
function csvDias(){
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const L=['Data;Dia;Matrícula;Rota;Estado;Receita (MT);Motorista;Comentário'];
  let start=CARS.map(c=>cfg.inicio[c.id]).sort()[0];const ds=Object.keys(dias).sort();if(ds[0]&&ds[0]<start)start=ds[0];
  for(let d=start;d<=hoje();d=add(d,1))for(const c of CARS){const st=estado(c.id,d);if(st==='fora')continue;const r=dias[d]?.[c.id];
    L.push([d,SEM[parse(d).getDay()],c.nome,c.rota,ROT[st],st==='ok'?(r.receita||0):0,r?.motorista||'',r?.nota||''].map(q).join(';'))}
  L.push('');L.push('MANUTENÇÕES');L.push('Matrícula;Início;Fim;Dias;Custo (MT);Descrição;Comentários');
  for(const m of [...mants].sort((a,b)=>a.inicio.localeCompare(b.inicio))){const f=m.fim||hoje();
    L.push([carName(m.carro),m.inicio,m.fim||'em curso',diff(m.inicio,f)+1,m.custo||0,m.descricao,(m.comentarios||[]).map(k=>k.data+': '+k.texto).join(' | ')].map(q).join(';'))}
  return '﻿'+L.join('\r\n');
}
let restoreData=null;
const val=id=>document.getElementById(id)?.value??'';

document.addEventListener('change',e=>{const m=e.target.name?.match(/^e-(.+)$/);if(m){const rw=document.getElementById('rw-'+m[1]);if(rw)rw.hidden=e.target.value==='falta'}});
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.tab;delArm=null;document.activeElement?.blur();render();scrollTo(0,0)}});

document.getElementById('main').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a!=='mdel')delArm=null;
  if(a==='day'){sel=add(sel,+b.dataset.n);return render()}
  if(a==='goto'){sel=b.dataset.d;view='dia';calM=sel.slice(0,7);render();return scrollTo(0,0)}
  if(a==='tab'){view=b.dataset.t;return render()}
  if(a==='cal'){calM=monthAdd(calM,+b.dataset.n);return render()}
  if(a==='rep'){repM=monthAdd(repM,+b.dataset.n);return render()}
  if(a==='bk'||a==='bkdl'){const r=await saveFile('minibus-copia-'+hoje()+'.json',backupJSON(),'application/json',a==='bkdl'?'download':'');if(r==='ok'){markBackup();toast('Cópia de segurança criada');render()}return}
  if(a==='csv'){const r=await saveFile('minibus-registos-'+hoje()+'.csv',csvDias(),'text/csv','');if(r==='ok')toast('Ficheiro Excel criado');return}
  if(a==='rsno'){restoreData=null;return render()}
  if(a==='rsok'){if(!restoreData)return;const d=restoreData;cfg={...DEF,...d.cfg,inicio:{...DEF.inicio,...d.cfg?.inicio},meta:{...DEF.meta,...d.cfg?.meta},motorista:{...DEF.motorista,...d.cfg?.motorista}};dias=d.dias;mants=d.mants;restoreData=null;persist();render();return toast('Dados restaurados')}
  if(a==='save'){
    const c=b.dataset.c;const est=document.querySelector(`input[name="e-${c}"]:checked`)?.value;
    if(!est)return toast('Escolha Entrou ou Não entrou');
    const rec={estado:est,receita:est==='entrou'?Math.max(0,Number(val('rec-'+c))||0):0,nota:val('nota-'+c).trim(),motorista:val('mot-'+c).trim(),em:new Date().toISOString()};
    const doc={...(dias[sel]||{}),data:sel,[c]:rec};dias[sel]=doc;const d=sel;b.blur();render();
    return write(()=>db.doc('dias/'+d).set(doc),carName(c)+' · '+shortDate(d)+' guardado');
  }
  if(a==='clear'){
    const c=b.dataset.c;const doc={...(dias[sel]||{})};delete doc[c];const d=sel;
    const vazio=!CARS.some(x=>doc[x.id]);if(vazio)delete dias[d];else dias[d]=doc;render();
    return write(()=>vazio?db.doc('dias/'+d).delete():db.doc('dias/'+d).set(doc),'Registo apagado');
  }
  if(a==='madd'){
    const ini=val('m-ini');const fim=val('m-fim')||null;
    if(!ini)return toast('Indique a data de início');
    if(fim&&fim<ini)return toast('O fim não pode ser antes do início');
    const id='m'+Date.now().toString(36);
    const m={id,carro:val('m-car'),inicio:ini,fim,descricao:val('m-desc').trim(),custo:Math.max(0,Number(val('m-custo'))||0),comentarios:[],criado:new Date().toISOString()};
    mants.push(m);document.activeElement?.blur();render();
    return write(()=>db.doc('manutencoes/'+id).set(m),'Manutenção registada');
  }
  const m=mants.find(x=>x.id===b.dataset.id);if(!m)return;
  const upd=(patch,msg)=>{Object.assign(m,patch);document.activeElement?.blur();render();return write(()=>db.doc('manutencoes/'+m.id).set({...m}),msg)};
  if(a==='mcom'){const t=val('c-'+m.id).trim();if(!t)return toast('Escreva o comentário');return upd({comentarios:[...(m.comentarios||[]),{data:hoje(),texto:t}]},'Comentário adicionado')}
  if(a==='mclose')return upd({fim:hoje()},carName(m.carro)+' de volta à escala');
  if(a==='mreopen')return upd({fim:null},'Manutenção reaberta');
  if(a==='mcost')return upd({custo:Math.max(0,Number(val('mc-'+m.id))||0)},'Custo actualizado');
  if(a==='mdel'){
    if(delArm!==m.id){delArm=m.id;return render()}
    delArm=null;mants=mants.filter(x=>x.id!==m.id);render();
    return write(()=>db.doc('manutencoes/'+m.id).delete(),'Manutenção apagada');
  }
});
document.getElementById('main').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act="cfg"]');if(!b)return;
  const n={...cfg,inicio:{...cfg.inicio},meta:{...cfg.meta},motorista:{...cfg.motorista}};
  for(const c of CARS){n.meta[c.id]=Math.max(0,Number(val('s-meta-'+c.id))||0);n.inicio[c.id]=val('s-ini-'+c.id)||cfg.inicio[c.id];n.motorista[c.id]=val('s-mot-'+c.id).trim()}
  cfg=n;b.blur();render();write(()=>db.doc('config/geral').set(n),'Definições guardadas');
});

/* dados */
function setSync(cls,txt){const s=document.getElementById('sync');s.className='sync '+cls;s.querySelector('span').textContent=txt}
document.addEventListener('change',e=>{
  if(e.target.id!=='rf')return;const f=e.target.files?.[0];e.target.blur();e.target.value='';if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.app!=='controlo-minibus'||typeof d.dias!=='object'||!Array.isArray(d.mants))throw 0;d.criado=d.criado||d.guardado||new Date().toISOString();restoreData=d;render();document.getElementById('copia')?.scrollIntoView()}catch(_){toast('Este ficheiro não é uma cópia desta aplicação')}};rd.readAsText(f);
});
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);cfg={...DEF,...d.cfg,inicio:{...DEF.inicio,...d.cfg?.inicio},meta:{...DEF.meta,...d.cfg?.meta},motorista:{...DEF.motorista,...d.cfg?.motorista}};dias=d.dias||{};mants=d.mants||[]}
  setSync('on','Guardado no telemóvel')}catch(e){setSync('off','Sem memória: use cópias')}
try{navigator.storage?.persist?.()}catch(e){}
render();
</script>
